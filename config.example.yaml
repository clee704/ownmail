# ownmail example configuration
# Copy this file to config.yaml and adjust to your needs.
# All fields below are optional unless marked as required.

# Directory where email .eml files are stored.
# Relative paths are resolved from the working directory.
# Default: ./archive
archive_root: /path/to/emails

# Optional: store the database (ownmail.db) in a separate directory.
# Useful when emails live on a NAS/external drive but you want
# the database on a fast local SSD for snappy search.
# Default: same as archive_root
# db_dir: /path/to/fast/local/storage

# Optional: place disposable Active mail in another directory.
# Default: a sibling named .<archive-name>-active; /path/to/emails uses
# /path/to/.emails-active. Relative paths use the working directory.
# The cache and archive must be separate: neither may contain the other.
# Choose an empty directory or this archive's existing ownmail Active cache.
# active_cache_dir: /path/to/live-cache

# ─── Email Sources ────────────────────────────────────────────
#
# Inbox, Drafts, other observed unfinished mail, and unconfirmed states use
# the Active cache.
# Confirmed server edits replace cached contents; confirmed deletion, Trash,
# or Spam retires cached copies after a complete listing without message errors.
# Failed refreshes keep prior copies and show stale or unconfirmed state.
#
# Ordinary filed and Sent mail is eligible outside Active or discarded states.
# Unknown states and failed checks hold affected messages for a later run.
# Capture follows visible provider state; hidden or unadvertised unfinished
# states may be unavailable. See docs/archive.md for provider limits.
#
# Every download checks metadata for all mail visible to the provider.
# Date filters constrain capture while Active checks still cover visible mail.
# A fresh candidate read must confirm eligibility and supply contents and labels
# that save successfully. Unrelated source failures need not block that capture.
# Existing archive contents, labels, and local Trash remain unchanged.

sources:
  # Gmail via API (recommended)
  - name: personal                        # unique name for this source
    type: gmail_api                        # required
    account: you@gmail.com                 # required: Gmail address
    auth:
      secret_ref: keychain:oauth-token/you@gmail.com  # required
    include_labels: true                   # fetch Gmail labels (default: true)

    # Fetch Active contents for reading and search (default: true).
    # false stops Active content fetching while eligible capture continues.
    # Existing cache entries remain stale until confirmed capture or removal;
    # disabling this setting never makes Inbox or Drafts owned.
    active_downloads: true

    # Deprecated for downloads. Existing combinations of inbox and drafts
    # remain accepted, but none permits their capture. Trash and spam are
    # always excluded, and naming them here remains a configuration error.
    # Legacy reconcile still uses these settings when reviewing owned mail.
    # exclude_roles:
    #   - inbox
    #   - drafts

  # You can add multiple sources:
  # - name: work
  #   type: gmail_api
  #   account: you@company.com
  #   auth:
  #     secret_ref: keychain:oauth-token/you@company.com
  #   include_labels: true

  # IMAP source (any server: Gmail, Fastmail, mailbox.org, self-hosted)
  # - name: work_imap
  #   type: imap
  #   host: imap.company.com                 # required for IMAP
  #   account: you@company.com
  #   auth:
  #     secret_ref: keychain:imap-password/you@company.com
  #
  #   active_downloads: true
  #
  #   # Skip contents from these exact folder names. Metadata checks still
  #   # inspect visible folders, and exclusions mark the view incomplete.
  #   # Folder moves are reconsidered on later downloads. Owned messages
  #   # and their saved labels stay unchanged.
  #   exclude_folders:
  #     - Newsletters
  #     - '[Gmail]/Important'

# ─── Optional Server Cleanup ─────────────────────────────────
#
# Cleanup is a separate manual command; downloads never run it.
# Preview a configured source: ownmail cleanup --source personal
# --apply explicitly requests eligible Gmail messages be moved to server Trash.
# Existing Gmail sign-in stays read-only: previews work, but applying requires
# gmail.modify. A separate cleanup consent flow is not implemented, and --apply
# does not request broader permissions. IMAP cleanup remains held.
# Cleanup verifies owned contents, complete capture metadata, account identity,
# and current message/thread activity. Local labels and files stay unchanged.
# Legacy metadata without evidence of a complete capture remains held.
# See docs/archive.md for retry behavior, provider limits, and Trash retention.

# ─── Web Interface ────────────────────────────────────────────

web:
  # Automatic downloads use the same Active refresh and capture lifecycle.
  # Keep ownmail serve running. Off by default (0); supported intervals:
  # 15, 30, 60, 360, or 1440 minutes after the previous run finishes.
  # download_interval_minutes: 0

  # Number of search results per page (1-500).
  # Default: 20
  page_size: 50

  # Block external images in emails by default (for privacy/security).
  # Images from trusted_senders are always shown.
  # Default: true
  block_images: true

  # Scale down wide HTML emails to fit the viewport.
  # Default: true
  auto_scale: true

  # Custom branding name shown in the header and page titles.
  # Default: ownmail
  # brand_name: My Mail Archive

  # Timezone for displaying email dates.
  # Uses IANA timezone names (e.g., America/New_York, Asia/Tokyo).
  # Default: server local timezone
  # timezone: America/New_York

  # Date format for search results (Python strftime).
  # Default: %b %d, %Y (e.g., "Jan 26, 2025")
  # date_format: '%b %d, %Y'

  # Date format for the message detail view (Python strftime).
  # Default: %a, %d %b %Y %H:%M:%S (e.g., "Tue, 27 Jan 2026 07:16:05")
  # detail_date_format: '%a, %d %b %Y %H:%M:%S'

  # Email addresses whose images are always loaded,
  # even when block_images is on. One per line.
  # Default: []
  trusted_senders:
    - noreply@example.com
    - billing@example.com
