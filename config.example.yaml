# ownmail example configuration
# Copy this file to config.yaml and adjust to your needs.
# All fields below are optional unless marked as required.

# Directory where email .eml files are stored.
# Relative paths are resolved from the working directory.
# Default: ./archive
archive_root: /path/to/emails

# Optional: store the database (ownmail.db) in a separate directory.
# Useful when emails live on a NAS/external drive but you want
# the database on a fast local SSD for snappy search.
# Default: same as archive_root
# db_dir: /path/to/fast/local/storage

# ─── Email Sources ────────────────────────────────────────────
#
# THE DOWNLOAD FILTER
#
# ownmail does not archive everything on the server. It archives mail you
# have finished with. A message is downloaded once it is no longer in any of
# these roles, whatever your provider happens to call them:
#
#   inbox   — you have not decided about it yet. It is still live in your
#             mail client, and adverts and one-time codes that you would have
#             deleted there would otherwise sit in the archive forever.
#   drafts  — the message is not finished. Capturing one freezes half a
#             sentence into the archive permanently.
#   trash   — you decided it was not worth keeping.
#   spam    — your provider decided for you.
#
# Sent mail IS archived. There is no triage step for outgoing mail — nobody
# files their Sent folder — so waiting for one would mean never archiving
# your own mail. Sending is the decision.
#
# FILTERING IS NOT PERMANENT EXCLUSION. Every run re-checks where a message
# is now, so mail you rescue from spam, or move out of the inbox, or send
# from a draft, is picked up on the next run. Nothing is written off.
#
# 'exclude_roles' below relaxes the first two. Trash and spam are not
# configurable and are always excluded — see the note under exclude_roles.

sources:
  # Gmail via API (recommended)
  - name: personal                        # unique name for this source
    type: gmail_api                        # required
    account: you@gmail.com                 # required: Gmail address
    auth:
      secret_ref: keychain:oauth-token/you@gmail.com  # required
    include_labels: true                   # fetch Gmail labels (default: true)

    # Roles to keep out of the archive.
    # Default: [inbox, drafts]
    #
    # The only two values you can set. Trash and spam are ALWAYS excluded and
    # naming them here is a config error, because a purge run (once you turn
    # one on) moves mail to trash — a trash-inclusive archive would keep
    # re-purging everything it ever purged and never settle.
    #
    # Set it to [] to archive your inbox as it arrives, and drafts with it.
    # Set it to [inbox] to archive drafts but not inbox mail, [drafts] for
    # the reverse.
    #
    # WIDENING THIS (removing a role) makes the next run rescan from scratch,
    # because mail the old setting skipped sits behind ownmail's bookmark and
    # would otherwise stay skipped forever, silently. The rescan re-reads the
    # server; it does not re-download anything already archived.
    #
    # NARROWING IT (adding a role) does not remove anything already archived
    # — 'ownmail reconcile' reports what the new setting would reject and can
    # move it to ownmail's bin, reversibly. But if you have purge enabled,
    # the next purge run deletes more from the server, because purge deletes
    # what the current filter admits.
    # exclude_roles:
    #   - inbox
    #   - drafts

  # You can add multiple sources:
  # - name: work
  #   type: gmail_api
  #   account: you@company.com
  #   auth:
  #     secret_ref: keychain:oauth-token/you@company.com
  #   include_labels: true

  # IMAP source (any server: Gmail, Fastmail, mailbox.org, self-hosted)
  # - name: work_imap
  #   type: imap
  #   host: imap.company.com                 # required for IMAP
  #   account: you@company.com
  #   auth:
  #     secret_ref: keychain:imap-password/you@company.com
  #
  #   # Extra folders to skip, BY NAME. The escape hatch for folders no role
  #   # describes — a mailing list you don't want kept, a shared folder.
  #   #
  #   # This ADDS to the role exclusion above; it does not replace it. Trash
  #   # and spam are skipped whether or not you name them, identified by what
  #   # the server says they are (IMAP SPECIAL-USE) rather than by spelling,
  #   # so it works whether yours are called 'Trash', 'Deleted Items',
  #   # 'INBOX.Trash' or a localized name. Names here must match the server
  #   # exactly.
  #   #
  #   # Excluding a folder by name stops mail being DOWNLOADED from it. It
  #   # does not stop the folder describing mail archived from elsewhere: a
  #   # message held in both Newsletters and Projects is downloaded from
  #   # Projects and keeps Newsletters as a label. Role-excluded folders are
  #   # different — they are not label sources either, so a deleted copy
  #   # never relabels the message you actually filed, and a healthy archive
  #   # carries no 'INBOX' label.
  #   #
  #   # Mail already archived from a folder you add here stays put — run
  #   # 'ownmail reconcile' to review it and move it to the bin.
  #   #
  #   # Editing this list changes what gets captured, so the next sync
  #   # rescans from scratch rather than resuming from where it left off —
  #   # otherwise mail the old setting skipped would stay skipped forever,
  #   # silently. The rescan re-reads folders; it does not re-download
  #   # anything already in the archive.
  #   #
  #   # What a rescan does NOT do is notice mail you MOVED OUT of a
  #   # NAME-excluded folder without changing this list. Such a message is
  #   # picked up once it lands somewhere ownmail is watching, which is the
  #   # normal case — moving it to another folder is enough. It stays
  #   # invisible only if it moves between two name-excluded folders. (The
  #   # roles are re-read every run, so they do not have this gap.)
  #   exclude_folders:
  #     - Newsletters
  #     - '[Gmail]/Important'

# ─── Web Interface ────────────────────────────────────────────

web:
  # Number of search results per page (1-500).
  # Default: 20
  page_size: 50

  # Block external images in emails by default (for privacy/security).
  # Images from trusted_senders are always shown.
  # Default: true
  block_images: true

  # Scale down wide HTML emails to fit the viewport.
  # Default: true
  auto_scale: true

  # Custom branding name shown in the header and page titles.
  # Default: ownmail
  # brand_name: My Mail Archive

  # Timezone for displaying email dates.
  # Uses IANA timezone names (e.g., America/New_York, Asia/Tokyo).
  # Default: server local timezone
  # timezone: America/New_York

  # Date format for search results (Python strftime).
  # Default: %b %d, %Y (e.g., "Jan 26, 2025")
  # date_format: '%b %d, %Y'

  # Date format for the message detail view (Python strftime).
  # Default: %a, %d %b %Y %H:%M:%S (e.g., "Tue, 27 Jan 2026 07:16:05")
  # detail_date_format: '%a, %d %b %Y %H:%M:%S'

  # Email addresses whose images are always loaded,
  # even when block_images is on. One per line.
  # Default: []
  trusted_senders:
    - noreply@example.com
    - billing@example.com
