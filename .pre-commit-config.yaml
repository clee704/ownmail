# Install both hook types:  pre-commit install
# Run everything by hand:    pre-commit run -a --hook-stage pre-push
#
# Two stages, split by cost. Lint and hygiene run per-commit (~0.4s) so they
# don't tax the commit-often policy in AGENTS.md. The test suite runs per-push
# (~11s) — once per push regardless of how many commits it carries, at the
# moment master actually becomes exposed.
#
# CI (.github/workflows/ci.yml) runs the same checks and stays the real gate:
# local runs can't prove a green build on their own, since the supported range
# is Python 3.10-3.12 and you're almost certainly on something newer.

default_install_hook_types: [pre-commit, pre-push]

# .eml test fixtures are byte-exact inputs — several deliberately carry broken
# encodings, truncated bodies, or missing trailing newlines. Never rewrite them.
exclude: ^tests/fixtures/

repos:
  # File hygiene — the rules CONTRIBUTING.md documents but nothing enforced.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  # Lint + format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Unused / undeclared / transitive dependencies.
  - repo: https://github.com/fpgmaas/deptry
    rev: 0.25.1
    hooks:
      - id: deptry

  # Tests + coverage gate, at push time. Local hook because it needs ownmail
  # and its dependencies importable — pass_filenames since pytest takes no
  # file args, and always runs the whole suite regardless of what changed.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (with coverage gate)
        entry: pytest --cov=ownmail -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
