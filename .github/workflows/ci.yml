name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format, and dependency checks — Python-version independent, so run
  # them once rather than per matrix entry.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: deptry
        run: deptry .

  # Test matrix over every Python version in pyproject.toml's classifiers.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # ownmail serve sanitizes HTML via a Node sidecar; the sanitizer tests
      # need node on PATH.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install browser tests
        if: matrix.python-version == '3.12'
        working-directory: ownmail/sanitizer
        run: |
          npm install --include=dev
          npx playwright install --with-deps chromium

      - name: pytest
        env:
          OWNMAIL_REQUIRE_BROWSER_TESTS: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: pytest --cov=ownmail --cov-report=term-missing
