name: Commits

# Separate from CI so a PR title edit re-runs only this check.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # PRs are squash-merged with the title as the commit header; direct pushes
  # land their own headers.
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_commit_msg.py --header "$TITLE"

      - name: Pushed commits
        if: github.event_name == 'push'
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: python3 scripts/check_commit_msg.py --range "$RANGE"
