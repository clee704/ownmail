{# Shared partial for email list rows #}
<ul class="ownmail-email-list" id="ownmail-email-list">
{% for result in results %}
    <li class="ownmail-email-row">
        <label class="ownmail-email-checkbox" onclick="event.stopPropagation()">
            <input type="checkbox" value="{{ result.email_id }}" onchange="onCheckboxChange(event, this)">
        </label>
        <a href="/email/{{ result.email_id }}" class="ownmail-email-row-link">
            <span class="ownmail-email-sender" title="{{ result.sender_name or result.sender or '(Unknown)' }}">{{ result.sender_name or result.sender or '(Unknown)' }}</span>
            <span class="ownmail-email-row-content">
                <span class="ownmail-email-subject">{{ result.subject or '(No subject)' }}</span>
                {% if result.snippet %}<span class="ownmail-email-snippet">{{ result.snippet }}</span>{% endif %}
            </span>
            <span class="ownmail-email-date">{{ result.date_short }}</span>
        </a>
    </li>
{% endfor %}
</ul>
