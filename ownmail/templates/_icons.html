{% macro icon(name, size=16) -%}
<svg class="ownmail-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'mail' -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
{%- elif name == 'inbox' -%}
<path d="m5 4-3 9v6a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-6l-3-9H5Z"/><path d="M2 13h6l2 3h4l2-3h6"/>
{%- elif name == 'sent' -%}
<path d="m21 3-7 18-4-7-7-4L21 3ZM10 14 21 3"/>
{%- elif name == 'draft' or name == 'file' -%}
<path d="M14 3H5v18h14V8l-5-5ZM14 3v5h5M8 13h8M8 17h6"/>
{%- elif name == 'archive' -%}
<rect x="3" y="3" width="18" height="4" rx="1"/><path d="M5 7v14h14V7M10 11h4"/>
{%- elif name == 'spam' -%}
<path d="m8 3-5 5v8l5 5h8l5-5V8l-5-5H8ZM12 7v6M12 17h.01"/>
{%- elif name == 'trash' -%}
<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>
{%- elif name == 'label' -%}
<path d="M3 3h8l10 10-8 8L3 11V3Z"/><circle cx="7.5" cy="7.5" r="1"/>
{%- elif name == 'image' -%}
<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-5 5 6"/>
{%- elif name == 'search' -%}
<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{%- elif name == 'chevron-left' -%}
<path d="m14 6-6 6 6 6"/>
{%- elif name == 'chevron-right' -%}
<path d="m10 6 6 6-6 6"/>
{%- elif name == 'refresh' -%}
<path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/>
{%- elif name == 'close' -%}
<path d="m6 6 12 12M6 18 18 6"/>
{%- elif name == 'arrow-left' -%}
<path d="M20 12H4m6-6-6 6 6 6"/>
{%- elif name == 'more' -%}
<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>
{%- elif name == 'download' -%}
<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>
{%- elif name == 'paperclip' -%}
<path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9a7 7 0 0 1 10 10l-9 9"/>
{%- elif name == 'menu' -%}
<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'sidebar' -%}
<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
{%- elif name == 'settings' -%}
<path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/>
{%- elif name == 'help' -%}
<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/>
{%- elif name == 'check' -%}
<path d="m5 12 4 4L19 6"/>
{%- endif -%}
</svg>
{%- endmacro %}
